
name: Build King Hardcore

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract Source
        run: |
          mkdir -p source
          unzip -q King-Hardcore-BossBar-Comet-Modified.zip -d source

      - name: Locate pom.xml
        run: |
          POM=$(find source -name pom.xml -print -quit)
          if [ -z "$POM" ]; then
            echo "pom.xml tidak ditemukan"
            find source -maxdepth 4 -type f
            exit 1
          fi
          echo "POM=$POM" >> "$GITHUB_ENV"

      - name: Build Plugin
        run: mvn -B -f "$POM" clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: King-Hardcore
          path: source/**/target/*.jar
          if-no-files-found: error
