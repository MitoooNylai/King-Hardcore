
name: Build King Hardcore

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source project
        run: |
          mkdir -p source
          unzip -q King-Hardcore-BossBar-Comet-source.zip -d source

      - name: Find Maven project
        run: |
          POM=$(find source -name pom.xml -print -quit)

          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml tidak ditemukan!"
            find source -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$POM")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan: $PROJECT_DIR"

      - name: Build with Maven
        run: mvn -B -f "$PROJECT_DIR/pom.xml" clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: King-Hardcore
          path: source/**/target/*.jar
          if-no-files-found: error
